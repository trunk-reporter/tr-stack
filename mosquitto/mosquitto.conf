# =============================================================================
# tr-stack Mosquitto configuration
#
# Every client must log in. Create mosquitto/passwd before starting the stack
# (see README "Quick Start"), using the same MQTT_USERNAME / MQTT_PASSWORD as
# .env and the "username"/"password" fields in config.json's MQTT plugins.
#
# The broker is published on 127.0.0.1:1883 by default. To accept remote
# trunk-recorder instances, set MQTT_BIND_IP in .env to your server's LAN/VPN
# address. Never set allow_anonymous to true.
# =============================================================================

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
