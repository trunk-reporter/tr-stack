services:

  # ---------------------------------------------------------------------------
  # mosquitto — MQTT broker (login required: mosquitto/passwd, see README)
  # trunk-recorder and tr-engine reach it over the compose network, so the
  # host port is only for local tools and, via explicit opt-in (MQTT_BIND_IP),
  # trunk-recorders on other hosts.
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Long syntax so a missing passwd file is an error instead of Docker
      # silently creating an empty directory in its place.
      - type: bind
        source: ./mosquitto/passwd
        target: /mosquitto/config/passwd
        read_only: true
        bind:
          create_host_path: false
      - mosquitto-data:/mosquitto/data

  # ---------------------------------------------------------------------------
  # postgres — Database (never published on the host)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (generate one with openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-trengine}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trengine}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # tr-engine — Backend API + call ingestion
  # ---------------------------------------------------------------------------
  tr-engine:
    image: ghcr.io/trunk-reporter/tr-engine:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trengine}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trengine}?sslmode=disable
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-trengine}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env (must match mosquitto/passwd)}
      AUDIO_DIR: /data/audio
    volumes:
      - ./data/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ---------------------------------------------------------------------------
  # tr-dashboard — Web UI
  # ---------------------------------------------------------------------------
  tr-dashboard:
    image: ghcr.io/trunk-reporter/tr-dashboard:latest
    restart: unless-stopped
    environment:
      TR_ENGINE_URL: http://tr-engine:8080
      TR_AUTH_TOKEN: ${AUTH_TOKEN:-}
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    depends_on:
      - tr-engine

  # ---------------------------------------------------------------------------
  # imbe-asr — IMBE vocoder → text transcription server
  # Models are downloaded from HuggingFace on first run if not present.
  # CPU by default; use docker-compose.gpu.yml for NVIDIA GPU acceleration.
  # ---------------------------------------------------------------------------
  imbe-asr:
    image: ghcr.io/trunk-reporter/imbe-asr-server:cpu
    restart: unless-stopped
    environment:
      IMBE_ASR_MODEL: "${IMBE_ASR_MODEL:-trunk-reporter/imbe-asr-base-512d-p25}"
      IMBE_ASR_BEAM_WIDTH: "${IMBE_ASR_BEAM_WIDTH:-100}"
      IMBE_ASR_DEVICE: "${IMBE_ASR_DEVICE:-cpu}"
    volumes:
      - ./data/models:/models
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # trunk-recorder — P25 SDR scanner
  # ---------------------------------------------------------------------------
  trunk-recorder:
    image: ghcr.io/trunk-reporter/trunk-recorder:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - ./config.json:/app/config.json:ro
      - ./data/audio:/app/audio
      - ./talkgroups:/app/talkgroups:ro
    depends_on:
      - mosquitto
      - imbe-asr

  # ---------------------------------------------------------------------------
  # caddy — Reverse proxy: single port for dashboard + API
  # BIND_IP is required: choosing who can reach the dashboard (this machine,
  # your LAN, or every interface) is an explicit decision. See sample.env.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:?Set BIND_IP in .env (LAN IP, 127.0.0.1, or 0.0.0.0 for all interfaces)}:${HTTP_PORT:-80}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tr-engine
      - tr-dashboard

volumes:
  mosquitto-data:
  caddy_data:
  caddy_config:
